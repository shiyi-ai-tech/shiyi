function providerOpts(module) {
  if (module === 'fb') return Object.keys(PROVIDERS).map(k=>({key:k,name:k})).concat([{key:'custom',name:t('custom')}]);
  if (module === 'light') {
    const mn = cfgState.main.provider;
    return [{key:'follow', name:t('followMain')+' ('+mn+')'}].concat(Object.keys(PROVIDERS).map(k=>({key:k,name:k}))).concat([{key:'custom',name:t('custom')}]);
  }
  return Object.keys(PROVIDERS).map(k=>({key:k,name:k})).concat([{key:'custom',name:t('custom')}]);
}

function buildDrop(module) {
  const drop = document.getElementById(module+'-drop');
  if (!drop) return;
  const st = cfgState[module];
  const opts = providerOpts(module);
  drop.innerHTML = opts.map(o => {
    const sel = (st.provider===o.key ? ' selected' : '');
    if (o.key==='custom') return `<div class="pvd-opt${sel}" onclick="selectPvd('${module}','custom')"><span class="opt-name">${t('custom')}</span><span class="opt-url" style="color:#555">${t('manualApiUrl')}</span></div>`;
    if (o.key==='follow') return `<div class="pvd-opt${sel}" onclick="selectPvd('${module}','follow')"><span class="opt-name">${o.name}</span></div>`;
    const p = PROVIDERS[o.key];
    if (!p) return '';
    const typeDesc = module==='emb' ? (p.emb_models ? t('modelDescEmb') : '') : t('modelDescLLM');
    return `<div class="pvd-opt${sel}" onclick="selectPvd('${module}','${o.key}')"><div class="opt-name">${o.key}</div><div class="opt-url">${p.base_url}</div></div>`;
  }).join('');
}

function togglePvd(module) {
  document.querySelectorAll('.pvd-drop.open').forEach(d => { if (d.id!==module+'-drop') d.classList.remove('open'); });
  buildDrop(module);
  document.getElementById(module+'-drop').classList.toggle('open');
}

function selectPvd(module, key) {
  const nameEl = document.getElementById(module+'-pvd-name');
  const st = cfgState[module];
  st.provider = key;
  if (module === 'fb') { st.enabled = true; }

  if (key==='follow') {
    const mn = cfgState.main.provider;
    nameEl.textContent = t('followMain')+' ('+mn+')';
    st.custom=false; st.customUrl='';
    document.getElementById(module+'-custom').value='0';
    document.getElementById(module+'-custom-url').value='';
    document.getElementById(module+'-detail').innerHTML = `<div class="detail-row"><span class="detail-lbl">${t('apiUrl')}</span><span class="detail-val" id="${module}-url">${t('followMainModels')}</span></div><div class="detail-row"><span class="detail-lbl">${t('modelType')}</span><span class="detail-val" id="${module}-models">${t('modelDescLight')}</span></div>`;
  } else if (key==='custom') {
    nameEl.textContent = t('custom');
    st.custom=true; st.customUrl='';
    document.getElementById(module+'-custom').value='1';
    document.getElementById(module+'-detail').innerHTML = `<div class="detail-row"><span class="detail-lbl">${t('apiUrl')}</span><input class="detail-input" id="${module}-custom-url-input" placeholder="https://..." onchange="cfgState.${module}.customUrl=this.value;document.getElementById('${module}-custom-url').value=this.value"></div>`;
  } else {
    nameEl.textContent = key;
    st.custom=false; st.customUrl='';
    document.getElementById(module+'-custom').value='0';
    document.getElementById(module+'-custom-url').value='';
    const p = PROVIDERS[key];
    const typeDesc = module==='emb' ? t('modelDescEmb') : t('modelDescLLM');
    document.getElementById(module+'-detail').innerHTML = `<div class="detail-row"><span class="detail-lbl">${t('apiUrl')}</span><span class="detail-val" id="${module}-url">${p.base_url}</span></div><div class="detail-row"><span class="detail-lbl">${t('modelType')}</span><span class="detail-val" id="${module}-models">${typeDesc}</span></div>`;
  }
  document.getElementById(module+'-drop').classList.remove('open');
  updateModelSelect(module);
  if (module==='main') onMainProviderChange();
}

function updateModelSelect(module) {
  const sel = document.getElementById(module+'-model');
  if (!sel) return;
  const st = cfgState[module];
  let models = [];
  if (module==='emb') {
    const p = PROVIDERS[st.provider];
    if (st.provider==='custom') { sel.innerHTML = `<option value="">${t('customPlaceholder')}</option>`; return; }
    if (p && p.emb_models) models = p.emb_models;
  } else if (module==='light' && st.provider==='follow') {
    const mp = PROVIDERS[cfgState.main.provider];
    if (mp) models = mp.models.slice();
  } else if (st.provider==='custom') {
    sel.innerHTML = `<option value="">${t('customPlaceholder')}</option>`; return;
  } else {
    const p = PROVIDERS[st.provider]; if (p) models = p.models;
  }
  const prev = st.model;
  sel.innerHTML = models.map(m => {
    let label = m;
    if (module==='light' && st.provider!=='custom') {
      let pk = st.provider==='follow' ? cfgState.main.provider : st.provider;
      const mp = PROVIDERS[pk];
      if (mp && m===mp.fast) label = m + ' ('+t('recommended')+')';
    }
    return `<option value="${m}"${m===prev?' selected':''}>${label}</option>`;
  }).join('') + '<option value="custom">'+t('custom')+'</option>';
  if (module==='light' && st.provider==='follow') {
    const mp = PROVIDERS[cfgState.main.provider];
    if (mp && mp.fast) { sel.value = mp.fast; st.model = mp.fast; }
  }
}

function onMainProviderChange() {
  if (cfgState.light.provider==='follow') {
    document.getElementById('light-pvd-name').textContent = t('followMain')+' ('+cfgState.main.provider+')';
    updateModelSelect('light');
  }
}

function toggleFallback(e) {
  if (e && (e.target.closest('.pvd-btn') || e.target.closest('.pvd-drop'))) return;
  const b = document.getElementById('fb-body'), a = document.getElementById('fb-arr');
  b.classList.toggle('open'); a.textContent = b.classList.contains('open')?'▼':'▶';
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.pvd-btn') && !e.target.closest('.pvd-drop'))
    document.querySelectorAll('.pvd-drop.open').forEach(d=>d.classList.remove('open'));
});

function initModels() { updateModelSelect('main'); updateModelSelect('emb'); updateModelSelect('light'); updateModelSelect('fb'); }

let channelData = {};

async function loadChannels() {
  const container = document.getElementById('channelCards');
  if (!container) return;
  try {
    const r = await fetch('/api/channels'); channelData = await r.json();
    let html = '';
    for (const [chId, ch] of Object.entries(channelData)) {
      // WeChat channel: simplified QR scan button
      if (chId === 'wechat') {
        const wechatConfigured = ch.fields.some(f => f.value_set);
        const statusBadge = wechatConfigured
          ? `<span style="font-size:10px;padding:3px 10px;border-radius:10px;background:#0a2a0a;color:#4c4;border:1px solid #1a4a1a">${t('channelConfigured')}</span>`
          : `<span style="font-size:10px;padding:3px 10px;border-radius:10px;background:#1a1a1a;color:#666;border:1px solid #252525">${t('channelNotConfigured')}</span>`;
        html += `<div class="ch-card" id="ch-wechat">`;
        html += `<div class="ch-header" onclick="toggleChannel('wechat')">
          <span style="font-size:22px">${ch.icon}</span>
          <span style="font-size:14px;font-weight:600;color:var(--text);flex:1">${ch.name}</span>
          ${statusBadge}
          <span id="ch-arr-wechat" style="font-size:9px;color:#555;transition:transform .2s">▶</span>
        </div>`;
        html += `<div class="ch-body" id="ch-body-wechat" style="display:none">`;
        html += `<div style="padding:8px 0">
          <p style="font-size:12px;color:#888;margin-bottom:16px">${t('wechatScanDesc')}</p>
          <button id="wechat-qr-btn" style="width:100%;padding:14px;background:#07c160;border:1px solid #059a4a;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:1px" onclick="startWechatQR()">${t('wechatScanBtn')}</button>

          <div style="margin-top:14px;padding:12px;background:#0d0d0d;border-radius:8px;border:1px solid #1a1a1a">
            <div style="font-size:11px;color:#555;margin-bottom:6px">${t('wechatStepsTitle')}</div>
            <div style="font-size:11px;color:#888;line-height:1.8">1. ${t('wechatStep1')}<br>2. ${t('wechatStep2')}<br>3. ${t('wechatStep3')}</div>
          </div>
        </div>`;
        html += `</div></div>`;
        continue;
      }
      const configured = ch.fields.length > 0 && ch.fields.some(f => f.value_set);
      const noFields = ch.fields.length === 0;
      // For feishu: check if all required fields are set (app_id + app_secret)
      const fullyConfigured = noFields ? false : ch.fields.filter(f => f.key !== 'base_url').every(f => f.value_set);
      const statusBadge = noFields
        ? `<span style="font-size:10px;padding:3px 10px;border-radius:10px;background:#1a1a1a;color:#555;border:1px solid #252525">${t('channelComingSoon')}</span>`
        : fullyConfigured
          ? `<span style="font-size:10px;padding:3px 10px;border-radius:10px;background:#0a2a0a;color:#4c4;border:1px solid #1a4a1a">${t('channelConfigured')}</span>`
          : configured
            ? `<span style="font-size:10px;padding:3px 10px;border-radius:10px;background:#1a1500;color:#eab308;border:1px solid #3a3000">部分配置</span>`
            : `<span style="font-size:10px;padding:3px 10px;border-radius:10px;background:#1a1a1a;color:#666;border:1px solid #252525">${t('channelNotConfigured')}</span>`;

      html += `<div class="ch-card" id="ch-${chId}">`;
      html += `<div class="ch-header" onclick="${noFields?'':`toggleChannel('${chId}')`}">
        <span style="font-size:22px">${ch.icon}</span>
        <span style="font-size:14px;font-weight:600;color:var(--text);flex:1">${ch.name}</span>
        ${statusBadge}
        <span id="ch-arr-${chId}" style="font-size:9px;color:#555;transition:transform .2s">${noFields?'':'▶'}</span>
      </div>`;
      html += `<div class="ch-body" id="ch-body-${chId}" style="display:none">`;
      if (noFields) {
        html += `<p style="font-size:12px;color:#555">${t('channelComingSoon')}</p>`;
      } else {
        for (const f of ch.fields) {
          const ph = f.secret ? (f.value_set ? t('channelConfigured') : f.placeholder) : (f.value_set ? f.value : f.placeholder);
          html += `<div style="margin-top:12px"><div style="font-size:12px;color:#888;margin-bottom:6px">${f.label}${f.secret && f.value_set ? ' <span style="color:#4c4;font-size:10px">✓</span>' : ''}</div>`;
          html += `<input type="${f.secret?'password':'text'}" id="ch-${chId}-${f.key}" placeholder="${ph}" style="width:100%;padding:10px 12px;background:#1c1c1c;border:1px solid #1f1f1f;border-radius:8px;color:#d4d4d4;font-size:12px;font-family:monospace;outline:none"></div>`;
        }
        if (ch.scopes && ch.scopes.length > 0) {
          html += `<div style="margin-top:14px"><div style="font-size:12px;color:#888;margin-bottom:8px">${t('channelRequiredScopes')}</div><div style="display:flex;flex-wrap:wrap;gap:6px">`;
          for (const s of ch.scopes) {
            html += `<span style="font-size:11px;padding:3px 10px;border-radius:6px;background:#0a1a2a;color:#7aa2f7;border:1px solid #1a2a4a;font-family:monospace">${s}</span>`;
          }
          html += `</div></div>`;
        }
        if (ch.event) {
          html += `<div style="margin-top:10px"><span style="font-size:12px;color:#888">${t('channelEvent')}: </span><span style="font-size:12px;color:#aaa;font-family:monospace">${ch.event}</span></div>`;
        }
        // Guide steps - button to open modal
        if (ch.guide_steps && ch.guide_steps.length > 0) {
          html += `<div style="margin-top:14px"><button style="width:100%;padding:12px;background:#0d1a2d;border:1px solid #1a2a4a;border-radius:8px;color:#7aa2f7;font-size:13px;cursor:pointer;text-align:center" onclick="showChannelGuide('${chId}')">📖 查看详细配置指南</button></div>`;
        }
        // Import JSON for scopes
        if (ch.import_json) {
          html += `<div style="margin-top:14px"><div style="font-size:12px;color:#888;margin-bottom:8px">批量导入权限 JSON（复制到飞书权限管理→批量导入→应用身份权限）</div>`;
          html += `<div style="position:relative"><pre style="background:#0d0d0d;padding:12px;border-radius:8px;font-size:11px;color:#aaa;overflow-x:auto;border:1px solid #222;font-family:Monaco,monospace;white-space:pre-wrap;word-break:break-all">${ch.import_json}</pre>`;
          html += `<button style="position:absolute;top:8px;right:8px;background:#2a2a2a;border:1px solid #333;color:#888;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer" onclick="navigator.clipboard.writeText(this.parentElement.querySelector('pre').textContent);this.textContent='已复制';setTimeout(()=>this.textContent='复制',1500)">复制</button></div></div>`;
        }
        html += `<div style="display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #222">`;
        html += `<button class="btn-primary" style="padding:10px 18px;border-radius:8px;font-size:13px;cursor:pointer;border:none" onclick="saveChannel('${chId}')">${t('channelSave')}</button>`;
        html += `<button class="btn-secondary" style="padding:10px 18px;border-radius:8px;font-size:13px;cursor:pointer" onclick="testChannel('${chId}')" id="ch-test-${chId}">${t('channelTest')}</button>`;
        html += `</div>`;
        html += `<div id="ch-status-${chId}" style="margin-top:10px;padding:8px;border-radius:6px;font-size:12px;text-align:center;display:none"></div>`;
      }
      html += `</div></div>`;
    }
    container.innerHTML = html;
  } catch(e) { container.innerHTML = `<p style="color:#e44;font-size:12px">加载渠道失败: ${e.message}</p>`; }
}

async function startWechatQR() {
  const btn = document.getElementById('wechat-qr-btn');
  if (!btn) return;
  btn.disabled = true; btn.textContent = t('wechatScanning');

  // Open popup window for QR display + status
  const popup = window.open('', 'wechatQR', 'width=420,height=480,scrollbars=no,resizable=no');
  const popupStyles = `*{margin:0;padding:0;box-sizing:border-box}body{background:#111;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center}.icon{font-size:64px;margin-bottom:16px}.status{font-size:16px;color:#aaa;margin-bottom:8px}.hint{font-size:12px;color:#555;line-height:1.6}.spinner{display:inline-block;width:24px;height:24px;border:2px solid #333;border-top-color:#7aa2f7;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}.ok{color:#4ade80}.err{color:#ef4444}.qr-img{max-width:280px;max-height:280px;border:8px solid #fff;border-radius:8px;margin:12px 0}@keyframes spin{to{transform:rotate(360deg)}}`;

  function updatePopup(html) {
    if (popup && !popup.closed) {
      popup.document.body.innerHTML = html;
    }
  }

  if (popup) {
    popup.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>微信扫码登录</title><style>${popupStyles}</style></head><body><div class="icon">💬</div><div class="status"><span class="spinner"></span>正在获取二维码…</div><div class="hint">请稍候</div></body></html>`);
    popup.document.close();
  }

  try {
    // Step 1: Fetch QR code from iLink
    const initR = await fetch('/api/channels/wechat/qr-init', { method: 'POST' });
    const initD = await initR.json();
    if (initD.status !== 'ok') {
      updatePopup(`<div style="font-size:64px;margin-bottom:16px">❌</div><div style="font-size:16px;color:#ef4444;font-weight:600;margin-bottom:8px">获取二维码失败</div><div style="font-size:13px;color:#888">${escHtml(initD.message || 'iLink 服务暂不可用，请稍后重试')}</div>`);
      btn.textContent = t('wechatRetryBtn');
      return;
    }

    // Show QR image in popup — use backend to generate real QR PNG
    const qrValue = initD.qrcode_value;
    const qrImgUrl = `/api/channels/wechat/qr-image?value=${encodeURIComponent(qrValue)}`;
    updatePopup(`<div style="font-size:14px;color:#7aa2f7;font-weight:600;margin-bottom:8px">请使用微信扫描二维码</div><img class="qr-img" src="${escHtml(qrImgUrl)}" alt="WeChat QR" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div style="display:none;font-size:13px;color:#888;margin:12px 0">二维码图片加载失败，请尝试重新获取</div><div style="font-size:11px;color:#555;margin-top:4px">扫描后请在微信中确认授权</div>`);

    // Step 2: Poll for scan status
    let pollCount = 0;
    const maxPolls = 300; // ~5 minutes at 1s interval
    const pollInterval = setInterval(async () => {
      pollCount++;
      if (pollCount > maxPolls || (popup && popup.closed)) {
        clearInterval(pollInterval);
        btn.textContent = t('wechatRetryBtn');
        btn.disabled = false;
        return;
      }
      try {
        const sr = await fetch('/api/channels/wechat/qr-status');
        const sd = await sr.json();
        if (sd.status === 'confirmed') {
          clearInterval(pollInterval);
          updatePopup(`<div style="font-size:64px;margin-bottom:16px">✅</div><div style="font-size:18px;color:#4ade80;font-weight:600;margin-bottom:8px">微信登录成功</div><div style="font-size:13px;color:#888">网关将自动启动，此窗口可关闭</div>`);
          setTimeout(() => { try { popup.close(); } catch(e) {} }, 3000);
          btn.textContent = t('wechatScanBtn');
          btn.disabled = false;
          // Auto-start gateway
          try { await fetch('/api/gateway/wechat/start', { method: 'POST' }); } catch(e) {}
          // Update status badge
          const badge = document.querySelector('#ch-wechat .ch-header span[style*="border-radius:10px"]');
          if (badge) { badge.textContent = t('channelConfigured'); badge.style.cssText = 'font-size:10px;padding:3px 10px;border-radius:10px;background:#0a2a0a;color:#4c4;border:1px solid #1a4a1a'; }
        } else if (sd.status === 'scaned') {
          // Update popup to show "scanned, waiting for confirmation"
          updatePopup(`<div style="font-size:64px;margin-bottom:16px">📱</div><div style="font-size:16px;color:#7aa2f7;font-weight:600;margin-bottom:8px">已扫码</div><div style="font-size:13px;color:#aaa">请在微信中点击确认授权…</div>`);
        } else if (sd.status === 'expired') {
          // QR expired — refresh if server provided new QR
          if (sd.qrcode_value) {
            const newQrUrl = `/api/channels/wechat/qr-image?value=${encodeURIComponent(sd.qrcode_value)}`;
            updatePopup(`<div style="font-size:14px;color:#eab308;font-weight:600;margin-bottom:8px">二维码已刷新，请重新扫描</div><img class="qr-img" src="${escHtml(newQrUrl)}" alt="WeChat QR"><div style="font-size:11px;color:#555;margin-top:4px">扫描后请在微信中确认授权</div>`);
          } else {
            clearInterval(pollInterval);
            updatePopup(`<div style="font-size:64px;margin-bottom:16px">⏰</div><div style="font-size:16px;color:#eab308;font-weight:600;margin-bottom:8px">二维码已过期</div><div style="font-size:13px;color:#888">请重新点击扫码按钮</div>`);
            btn.textContent = t('wechatRetryBtn');
            btn.disabled = false;
          }
        } else if (sd.status === 'error') {
          clearInterval(pollInterval);
          updatePopup(`<div style="font-size:64px;margin-bottom:16px">❌</div><div style="font-size:16px;color:#ef4444;font-weight:600;margin-bottom:8px">登录失败</div><div style="font-size:13px;color:#888">${escHtml(sd.message || '未知错误')}</div>`);
          btn.textContent = t('wechatRetryBtn');
          btn.disabled = false;
        }
        // status === 'wait': keep polling silently
      } catch(e) {
        // Network error — keep polling
      }
    }, 1500);

  } catch(e) {
    updatePopup(`<div style="font-size:64px;margin-bottom:16px">❌</div><div style="font-size:16px;color:#ef4444;font-weight:600;margin-bottom:8px">连接失败</div><div style="font-size:13px;color:#888">${escHtml(e.message)}</div>`);
    btn.textContent = t('wechatRetryBtn');
  } finally { btn.disabled = false; }
}

function toggleChannel(chId) {
  const body = document.getElementById('ch-body-' + chId);
  const arr = document.getElementById('ch-arr-' + chId);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (arr) arr.style.transform = open ? '' : 'rotate(90deg)';
}

async function saveChannel(chId) {
  const ch = channelData[chId];
  if (!ch) return;
  const config = {};
  for (const f of ch.fields) {
    const input = document.getElementById(`ch-${chId}-${f.key}`);
    if (input) config[f.key] = input.value.trim();
  }
  try {
    const r = await fetch('/api/channels', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({channel: chId, config}),
    });
    const d = await r.json();
    const statusEl = document.getElementById('ch-status-' + chId);
    if (r.ok && d.status === 'ok') {
      if (statusEl) { statusEl.textContent = t('channelSaved'); statusEl.className = ''; statusEl.style.cssText = 'margin-top:10px;padding:8px;border-radius:6px;font-size:12px;text-align:center;background:#0a2a0a;color:#4c4;border:1px solid #1a4a1a'; }
    } else {
      if (statusEl) { statusEl.textContent = d.message || t('channelSaveFail'); statusEl.style.cssText = 'margin-top:10px;padding:8px;border-radius:6px;font-size:12px;text-align:center;background:#2a0a0a;color:#e44;border:1px solid #4a1a1a'; }
    }
  } catch(e) {
    const statusEl = document.getElementById('ch-status-' + chId);
    if (statusEl) { statusEl.textContent = e.message; statusEl.style.cssText = 'margin-top:10px;padding:8px;border-radius:6px;font-size:12px;text-align:center;background:#2a0a0a;color:#e44;border:1px solid #4a1a1a'; }
  }
}

async function testChannel(chId) {
  const btn = document.getElementById('ch-test-' + chId);
  const statusEl = document.getElementById('ch-status-' + chId);
  if (!btn) return;
  await saveChannel(chId);
  btn.disabled = true; btn.textContent = t('channelTesting');
  try {
    const r = await fetch(`/api/channels/${chId}/test`);
    const d = await r.json();
    if (statusEl) {
      statusEl.style.cssText = `margin-top:10px;padding:8px;border-radius:6px;font-size:12px;text-align:center;background:${d.status==='ok'?'#0a2a0a':'#2a0a0a'};color:${d.status==='ok'?'#4c4':'#e44'};border:1px solid ${d.status==='ok'?'#1a4a1a':'#4a1a1a'}`;
      statusEl.textContent = d.message;
    }
    // 测试成功后更新状态标签为"已配置"
    if (d.status === 'ok') {
      const card = document.getElementById('ch-' + chId);
      if (card) {
        const badge = card.querySelector('.ch-header span[style*="border-radius:10px"]');
        if (badge) {
          badge.textContent = t('channelConfigured');
          badge.style.cssText = 'font-size:10px;padding:3px 10px;border-radius:10px;background:#0a2a0a;color:#4c4;border:1px solid #1a4a1a';
        }
      }
    }
  } catch(e) {
    if (statusEl) { statusEl.textContent = e.message; statusEl.style.cssText = 'margin-top:10px;padding:8px;border-radius:6px;font-size:12px;text-align:center;background:#2a0a0a;color:#e44;border:1px solid #4a1a1a'; }
  } finally { btn.disabled = false; btn.textContent = t('channelTest'); }
}

function getUrl(module) {
  const st = cfgState[module];
  if (module==='fb' && !st.enabled) return '';
  if (module==='light' && st.provider==='follow') return '';
  if (st.custom) {
    const inp = document.getElementById(module+'-custom-url-input');
    return inp ? inp.value.trim() : st.customUrl;
  }
  const p = PROVIDERS[st.provider];
  return p ? p.base_url : '';
}

function getModel(module) {
  const sel = document.getElementById(module+'-model');
  if (!sel || sel.value==='custom') return '';
  return sel.value;
}

async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('settingsStatus');
  if (!btn || !status) return;
  status.className = 'settings-status';

  const mainKey = document.getElementById('main-key').value.trim();
  const embKey = document.getElementById('emb-key').value.trim();
  const mainKeyOk = mainKey || document.getElementById('main-key').placeholder.includes(t('keyConfigured'));
  const embKeyOk = embKey || document.getElementById('emb-key').placeholder.includes(t('keyConfigured'));

  if (!mainKeyOk || !embKeyOk) { status.textContent = t('fillKeys'); status.className = 'settings-status err'; return; }
  const mainModel = getModel('main'), embModel = getModel('emb'), lightModel = getModel('light');
  if (!mainModel || !embModel || !lightModel) { status.textContent = t('selectModels'); status.className = 'settings-status err'; return; }

  const lightKey = document.getElementById('light-key').value.trim();
  const lightUrl = getUrl('light');
  const fbModel = cfgState.fb.enabled ? getModel('fb') : '';
  const fbKey = cfgState.fb.enabled ? document.getElementById('fb-key').value.trim() : '';
  const fbUrl = getUrl('fb');

  btn.disabled = true; btn.textContent = t('saving');
  try {
    const payload = {
      main_key: mainKey, embedding_key: embKey,
      main_model: mainModel, main_base_url: getUrl('main'),
      embedding_model: embModel, embedding_base_url: getUrl('emb'),
      light_model: lightModel, light_key: lightKey, light_base_url: lightUrl,
      fallback_model: fbModel, fallback_key: fbKey, fallback_base_url: fbUrl,
    };
    const res = await fetch('/api/config', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    const data = await res.json();
    if (res.ok && data.status==='ok') {
      status.textContent = t('saved'); status.className = 'settings-status ok';
      checkHealth(); // Refresh API status
      setTimeout(() => switchPanel('chat'), 1000);
    } else { status.textContent = data.message||data.detail||t('saveFail'); status.className = 'settings-status err'; }
  } catch(err) { status.textContent = '网络错误: '+err.message; status.className = 'settings-status err'; }
  finally { btn.disabled = false; btn.textContent = t('save'); }
}

async function clearCurrentMessages() {
  if (!currentSessionId) return;
  try {
    await fetch(`/api/sessions/${currentSessionId}/messages`, { method:'DELETE' });
    toast(t('clearOk'), 'ok');
    await loadMessages();
    await loadSessions();
  } catch(e) { toast(t('clearFail'), 'err'); }
}

// Channel Guide Modal
function showChannelGuide(chId) {
  const ch = channelData[chId];
  if (!ch || !ch.guide_steps) return;
  let html = `<div style="max-height:70vh;overflow-y:auto;padding:24px">`;
  html += `<h2 style="font-size:18px;color:#e4e4e4;margin-bottom:20px;display:flex;align-items:center;gap:10px">${ch.icon} ${ch.name} 配置指南</h2>`;
  for (const s of ch.guide_steps) {
    html += `<div style="margin-bottom:20px;padding:16px 18px;background:#141414;border:1px solid #222;border-radius:10px">`;
    html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="background:#2563eb;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">${s.step}</span><strong style="color:#e0e0e0;font-size:14px">${s.title}</strong></div>`;
    const descLines = s.desc.split('\\n');
    html += `<div style="font-size:13px;color:#aaa;line-height:1.8;padding-left:34px">`;
    for (const line of descLines) {
      if (line.startsWith('⚠️')) {
        html += `<div style="color:#eab308;margin-top:6px">${line}</div>`;
      } else {
        html += `<div>${line}</div>`;
      }
    }
    html += `</div></div>`;
  }
  // Import JSON
  if (ch.import_json) {
    html += `<div style="margin-top:8px;padding:16px 18px;background:#141414;border:1px solid #222;border-radius:10px">`;
    html += `<div style="font-size:14px;color:#e0e0e0;font-weight:600;margin-bottom:10px">📋 批量导入权限 JSON</div>`;
    html += `<div style="font-size:12px;color:#888;margin-bottom:10px">复制以下 JSON，粘贴到飞书权限管理 → 批量导入 → 应用身份权限</div>`;
    html += `<div style="position:relative"><pre style="background:#0a0a0a;padding:14px;border-radius:8px;font-size:11px;color:#aaa;overflow-x:auto;border:1px solid #1a1a1a;font-family:Monaco,monospace;white-space:pre-wrap;word-break:break-all">${ch.import_json}</pre>`;
    html += `<button style="position:absolute;top:10px;right:10px;background:#2a2a2a;border:1px solid #333;color:#ccc;padding:6px 14px;border-radius:6px;font-size:11px;cursor:pointer" onclick="navigator.clipboard.writeText(this.parentElement.querySelector('pre').textContent);this.textContent='已复制 ✓';setTimeout(()=>this.textContent='复制 JSON',2000)">复制 JSON</button></div>`;
    html += `</div>`;
  }
  html += `</div>`;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
}

      <div style="margin-bottom:14px;padding:12px;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:8px">
        <div style="font-size:12px;color:#7aa2f7;margin-bottom:6px">模型配置</div>
        <div id="cfgLLMStatus" style="font-size:11px;color:#555;margin-bottom:6px">留空则使用主模型配置</div>
        <div id="cfgCustomLLM" style="display:none;margin-top:8px">
          <div style="margin-bottom:8px">
            <label style="font-size:11px;color:#666;display:block;margin-bottom:4px">API Base URL</label>
            <input id="cfgBaseUrl" style="width:100%;padding:8px 10px;background:#111;border:1px solid #222;border-radius:6px;color:#ccc;font-size:13px" placeholder="如：https://api.deepseek.com/v1">
          </div>
          <div style="margin-bottom:8px">
            <label style="font-size:11px;color:#666;display:block;margin-bottom:4px">模型名称</label>
            <input id="cfgModelName" style="width:100%;padding:8px 10px;background:#111;border:1px solid #222;border-radius:6px;color:#ccc;font-size:13px" placeholder="如：deepseek-chat, gpt-4o">
          </div>
          <div style="margin-bottom:8px">
            <label style="font-size:11px;color:#666;display:block;margin-bottom:4px">API Key</label>
            <input id="cfgApiKey" type="password" style="width:100%;padding:8px 10px;background:#111;border:1px solid #222;border-radius:6px;color:#ccc;font-size:13px" placeholder="留空则使用主配置的 API Key" autocomplete="off">
          </div>
        </div>
        <button id="cfgToggleLLM" onclick="toggleCfgCustomLLM()" style="margin-top:6px;font-size:11px;color:#7aa2f7;background:none;border:none;cursor:pointer;padding:0">自定义 模型配置</button>
      </div>
      <div id="cfgAPIKeysContainer" style="margin-bottom:14px"></div>
    </div>
    <div class="modal-footer" style="padding:14px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #1a1a1a">
      <button onclick="document.getElementById('configureClerkModal').style.display='none'" style="padding:8px 20px;border-radius:8px;border:1px solid #333;background:transparent;color:#888;cursor:pointer">取消</button>
      <button onclick="submitConfigureClerk()" style="padding:8px 20px;border-radius:8px;border:none;background:#7aa2f7;color:#111;cursor:pointer;font-weight:600">保存</button>
    </div>
  </div>
</div>

</body>
</html>
